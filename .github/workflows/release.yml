name: build-packages

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  packages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libepoxy-dev libgl-dev libx11-dev \
            python3-pil desktop-file-validate curl gnupg

      - name: Build binary
        run: make -j"$(nproc)"

      - name: Build .deb, .AppImage and .xbps
        run: bash packaging/build-all.sh

      - name: Upload workflow artefacts
        uses: actions/upload-artifact@v4
        with:
          name: lennys-benchmark-packages
          path: |
            packaging/build/*.deb
            packaging/build/*.AppImage
            packaging/build/*.xbps
            packaging/build/SHA256SUMS
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packaging/build/*.deb
            packaging/build/*.AppImage
            packaging/build/*.xbps
            packaging/build/SHA256SUMS
          overwrite_files: true
          generate_release_notes: true
